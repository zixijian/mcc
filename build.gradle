plugins {
    id 'fabric-loom' version '1.11.3'
    id 'maven-publish'
}

version = ""
group = project.maven_group

base {
    archivesName = "mcc-1.0-dev"
}

loom {
    noIntermediateMappings()
}

repositories {
    maven {
        name = "Aliyun"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "Minecraft"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

repositories.all { repo ->
    if (repo instanceof MavenArtifactRepository) {
        if (repo.url.toString().contains("repo.maven.apache.org") || repo.url.toString().contains("repo1.maven.org")) {
            repo.url = uri("https://maven.aliyun.com/repository/public")
        }
    }
}

def generateMappingsJar() {
    def genDir = file("build/generated")
    genDir.mkdirs()
    def jarFile = new File(genDir, "mappings.jar")
    if (!jarFile.exists()) {
        def tinyContent = "tiny\t2\t0\tintermediary\tnamed\n"
        def os = new java.util.zip.ZipOutputStream(new FileOutputStream(jarFile))
        os.putNextEntry(new java.util.zip.ZipEntry("mappings/mappings.tiny"))
        os.write(tinyContent.getBytes("UTF-8"))
        os.closeEntry()
        os.close()
    }
    return jarFile
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings files(generateMappingsJar())
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveFileName = "mcc-1.0-dev.jar" // 强制指定输出文件名
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named('sourcesJar') {
    archiveFileName = "mcc-1.0-dev-sources.jar"
}
